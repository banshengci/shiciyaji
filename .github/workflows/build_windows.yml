name: Build Windows

# 本机未安装 Visual Studio 的 C++ 桌面工作负载（只有 VS Installer 残留，
# MSVC 与 CMake 均缺失），故 Windows 产物由云端 windows-latest runner 构建：
# 该镜像自带 VS 2022（含 C++ 工作负载）与 CMake。
#
# 触发：推送 v* 标签（与 iOS 工作流一致，一次发版出齐两端），
#       或在 Actions 页面手动 Run workflow。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    # 固定 windows-2022，不用 windows-latest：
    # Flutter 3.24.5 的 visual_studio.dart 只把 majorVersion == 17 映射为
    # "Visual Studio 17 2022"，其余版本（含更新的 VS）一律 fallback 到
    # "Visual Studio 16 2019"；而该 generator 在 runner 上并不存在，
    # CMake 会报 "could not find any instance of Visual Studio"。
    # windows-2022 镜像的 VS 固定在 2022（17.x），正好落在正确分支。
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境诊断（打印 VS 版本，便于日后排错）
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -prerelease -products * -format json |
              ConvertFrom-Json |
              Select-Object displayName, installationVersion |
              Format-Table -AutoSize
          } else {
            Write-Host "vswhere 不存在: $vswhere"
          }
          cmake --version

      - name: 安装 Flutter（锁定与本地一致的版本）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: 启用 Flutter 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 Release
        run: flutter build windows --release

      - name: 校验产物
        shell: pwsh
        run: |
          Get-ChildItem build/windows/x64/runner/Release | Select-Object Name, Length | Format-Table -AutoSize
          $exe = "build/windows/x64/runner/Release/shici_yaji.exe"
          if (-not (Test-Path $exe)) { throw "未找到 $exe" }

      - name: 打包（exe 依赖同目录的 dll 与 data，必须整目录分发）
        shell: pwsh
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE/shici_yaji-windows-x64.zip" -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: shici-yaji-windows
          path: shici_yaji-windows-x64.zip
          retention-days: 30

      - name: 发布到 Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: shici_yaji-windows-x64.zip
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
